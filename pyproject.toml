[project]
name = "my-python-template"
version = "0.1.0"
description = "Minimal Python project template — src/ and tests/, uv, ruff, mypy, pytest"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pre-commit>=4.6.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# `assert` is how pytest reports failures — not a security concern in tests.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
